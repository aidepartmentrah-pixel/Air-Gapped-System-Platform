manifest_schema_version: '2.0'
application:
  name: Golden Test App
  slug: golden-test-app
  description: A minimal synthetic application used as a Platform Period-A Golden
    Release fixture.
release:
  version: 1.0.4
  created_at: '2026-08-01T00:00:00+00:00'
  summary: Golden Release fixture declaring an unsupported manifest schema version.
  release_type: application
  engineering_state: awaiting_offline_qualification
source:
  repository: https://example.invalid/golden-test-app.git
  git_commit: 0123456789abcdef0123456789abcdef01234567
  git_tag: v1.0.4
  source_dirty: false
compatibility:
  release_contract_version: '1.0'
  minimum_rah_oip_version: 1.0.0
  supported_architectures:
  - amd64
  required_shared_services: []
deployment:
  canonical_path: /opt/rah/apps/golden-test-app
  compose_project_name: rah-golden-test-app
  entrypoints:
    install: scripts/install_offline.sh
    verify: scripts/verify_deployment.sh
  supported_operations:
    fresh_install: true
    update: false
    downgrade: false
    reinstall: false
  transition: {}
configuration:
  template: configuration/app.env.template
  inputs:
  - key: APP_PORT
    label: Application port
    type: port
    required: true
    source: operator
    default: 8501
docker:
  compose_file: compose/docker-compose.yml
  images:
  - service: backend
    repository: golden-test-app-backend
    tag: 1.0.4
    archive: docker-images/backend.tar
    required: true
database:
  required: false
persistent_state:
  preserve_during_update: []
offline_requirements:
  public_internet_required: false
  public_registry_required: false
  public_cdn_required: false
  online_model_registry_required: false
models:
  required: false
  artifacts: []
client:
  preparation_required: false
  https_required: false
verification:
  entrypoint: scripts/verify_deployment.sh
  required_checks:
  - docker_services
documentation:
  release_notes: documentation/release-notes.md
  installation: documentation/install.md
  update: documentation/update.md
  recovery: documentation/recovery.md
  known_issues: documentation/known-issues.md
integrity:
  checksum_algorithm: sha256
  checksum_file: checksums/SHA256SUMS
