server {
    # 8080, not the usual 80 -- this container runs with network_mode:
    # host (see platform/docker-compose.yml), so there is no host-port
    # remapping; this must be the exact port operators/browsers use.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The built app calls the same relative /api/v1/... paths the dev
    # server proxies (see vite.config.ts) — nginx does the equivalent
    # here. Both this container and backend run with network_mode: host
    # (see platform/docker-compose.yml) specifically so lifecycle
    # scripts Platform invokes see the real host's network, the same as
    # a human operator running them directly — which also means there is
    # no more Compose-internal DNS name "backend" to resolve; the real
    # host's own loopback is what both containers now share.
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app — any path that isn't a real static asset falls
    # back to index.html so TanStack Router's client-side routes (e.g.
    # /applications/{id}) work on a hard refresh, not just client-side
    # navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
