server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The built app calls the same relative /api/v1/... paths the dev
    # server proxies (see vite.config.ts) — nginx does the equivalent
    # here, forwarding to the real backend service on the Compose
    # network. `RAH_BACKEND_URL` lets this be overridden at deploy time;
    # the default matches this repo's own docker-compose.yml service name.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page app — any path that isn't a real static asset falls
    # back to index.html so TanStack Router's client-side routes (e.g.
    # /applications/{id}) work on a hard refresh, not just client-side
    # navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
